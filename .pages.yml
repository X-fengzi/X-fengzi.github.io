media:
  input: public/images
  output: /images
  rename: safe
  categories: [image]

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "内容：新建 {path}"
      update: "内容：更新 {path}"
      delete: "内容：删除 {path}"
      rename: "内容：重命名 {oldPath} -> {newPath}"

content:
  - name: works
    label: 创作 / Works
    type: collection
    path: src/content/works
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: create
    view:
      fields: [title, medium, pubDate, draft, featured]
      primary: title
      sort: [pubDate, title, year]
      search: [title, description, tags, medium]
      default:
        sort: pubDate
        order: desc
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: description
        label: 摘要
        type: text
        required: true
        description: 用一两句话说明作品，建议 30–100 字。
      - name: pubDate
        label: 发布日期
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: tags
        label: 标签
        type: string
        list: true
      - name: draft
        label: 保存为草稿
        type: boolean
        default: true
        description: 开启时不会出现在公开网站。
      - name: featured
        label: 精选内容
        type: boolean
        default: false
      - name: accent
        label: 视觉色彩
        type: select
        default: paper
        options:
          values:
            - name: paper
              label: 纸白
            - name: blue
              label: 蓝色
            - name: ink
              label: 墨黑
            - name: signal
              label: 荧光绿
      - name: medium
        label: 媒介 / 类型
        type: string
        required: true
        description: 例如摄影计划、程序实验、视觉设计。
      - name: year
        label: 创作年份
        type: number
        required: true
        options:
          min: 2000
          max: 2100
      - name: body
        label: 正文
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: true

