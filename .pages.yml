    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: description
        label: 摘要
        type: text
        required: true
      - name: pubDate
        label: 发布日期
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: tags
        label: 标签
        type: string
        list: true
      - name: draft
        label: 保存为草稿
        type: boolean
        default: true
        description: 开启时不会出现在公开网站。
      - name: featured
        label: 精选内容
        type: boolean
        default: false
      - name: accent
        label: 视觉色彩
        type: select
        default: paper
        options:
          values:
            - name: paper
              label: 纸白
            - name: blue
              label: 蓝色
            - name: ink
              label: 墨黑
            - name: signal
              label: 荧光绿
      - name: readingTime
        label: 阅读时间
        type: string
        description: 例如 6 分钟。
      - name: body
        label: 正文
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: true

  - name: notes
    label: 片段 / Notes
    type: collection
    path: src/content/notes
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: create
    view:
      fields: [title, pubDate, draft, featured]
      primary: title
      sort: [pubDate, title]
      search: [title, description, tags]
      default:
        sort: pubDate
        order: desc
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: description
        label: 摘要
        type: text
        required: true
      - name: pubDate
        label: 发布日期
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: tags
        label: 标签
        type: string
        list: true
      - name: draft
        label: 保存为草稿
        type: boolean
        default: true
        description: 开启时不会出现在公开网站。
      - name: featured
        label: 精选内容
        type: boolean
        default: false
      - name: accent
        label: 视觉色彩
        type: select
        default: paper
        options:
          values:
            - name: paper
              label: 纸白
            - name: blue
              label: 蓝色
            - name: ink
              label: 墨黑
            - name: signal
              label: 荧光绿
      - name: body
        label: 正文
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: true

  - name: series
    label: 专题 / Series
    type: collection
    path: src/content/series
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: create
    view:
      fields: [title, status, count, pubDate, draft]
      primary: title
      sort: [pubDate, title, status]
      search: [title, description, tags, status]
      default:
        sort: pubDate
        order: desc
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: description
        label: 摘要
        type: text
        required: true
      - name: pubDate
        label: 发布日期
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: tags
        label: 标签
        type: string
        list: true
      - name: draft
        label: 保存为草稿
        type: boolean
        default: true
        description: 开启时不会出现在公开网站。
      - name: featured
        label: 精选内容
        type: boolean
        default: false
      - name: accent
        label: 视觉色彩
        type: select
        default: paper
        options:
          values:
            - name: paper
              label: 纸白
            - name: blue
              label: 蓝色
            - name: ink
              label: 墨黑
            - name: signal
              label: 荧光绿
      - name: status
        label: 专题状态
        type: select
        required: true
        default: 进行中
        options:
          values: [进行中, 已完成, 持续更新]
      - name: count
        label: 当前篇数
        type: number
        required: true
        default: 1
        options:
          min: 1
      - name: body
        label: 专题说明
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: true
